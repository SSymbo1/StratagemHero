name: Production Release

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions: {}

jobs:
  build:
    name: Build Release Artifacts
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Package release artifact
        env:
          RELEASE_ARCHIVE: StratagemHero-pr-${{ github.event.pull_request.number }}.zip
        run: zip -r "$RELEASE_ARCHIVE" dist nginx.conf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Upload release intermediates
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            StratagemHero-pr-${{ github.event.pull_request.number }}.zip
            nginx.conf
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-package
          path: release-package

      - name: Generate release notes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          node --input-type=module <<'EOF'
          import { writeFile } from 'node:fs/promises'
          const description = (process.env.PR_BODY || '').trim() || '该 Pull Request 未提供变更说明。'
          const releaseNotes = [
            '## 变更说明',
            '',
            description,
            '',
            '## 合并信息',
            '',
            `- Pull Request：[#${process.env.PR_NUMBER}](${process.env.PR_URL})`,
            `- 标题：${process.env.PR_TITLE}`,
            `- 作者：@${process.env.PR_AUTHOR}`,
            `- 合并时间：${process.env.PR_MERGED_AT || '未知'}`,
            `- 合并提交：\`${process.env.PR_MERGE_COMMIT || '未知'}\``,
            '',
          ].join('\n')

          await writeFile('release-notes.md', releaseNotes, 'utf8')
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: release-package/StratagemHero-pr-${{ github.event.pull_request.number }}.zip
          NGINX_CONFIG: release-package/nginx.conf
          RELEASE_NOTES: release-notes.md
          RELEASE_TAG: pr-${{ github.event.pull_request.number }}
          RELEASE_TARGET: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_TITLE: >-
            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$NGINX_CONFIG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$NGINX_CONFIG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES" \
              --latest
          fi
