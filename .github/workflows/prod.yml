name: Production Release

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions: {}

jobs:
  build:
    name: Build Release Artifacts
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Generate release notes
        run: pnpm run release:notes -- release-notes.md

      - name: Package release artifact
        env:
          RELEASE_ARCHIVE: StratagemHero-pr-${{ github.event.pull_request.number }}.zip
        run: zip -r "$RELEASE_ARCHIVE" dist nginx.conf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Upload release intermediates
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            StratagemHero-pr-${{ github.event.pull_request.number }}.zip
            nginx.conf
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-package
          path: release-package

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: release-package/StratagemHero-pr-${{ github.event.pull_request.number }}.zip
          NGINX_CONFIG: release-package/nginx.conf
          RELEASE_NOTES: release-package/release-notes.md
          RELEASE_TAG: pr-${{ github.event.pull_request.number }}
          RELEASE_TARGET: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_TITLE: >-
            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$NGINX_CONFIG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$NGINX_CONFIG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES" \
              --latest
          fi
