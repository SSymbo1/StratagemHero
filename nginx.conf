# StratagemHero Windows Nginx 部署配置。
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  charset utf-8;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8081;
    server_name localhost;

    location = / {
      return 302 /StratagemHero/;
    }

    location = /StratagemHero {
      return 301 /StratagemHero/;
    }

    location /StratagemHero/ {
      alias html/dist/;
      index index.html;
      try_files $uri $uri/ /StratagemHero/index.html;
    }
  }
}
